name: Release

on:
  push:
    branches: [master]
  # "Run workflow" button in the Actions tab, or `gh workflow run release.yml`.
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never publish something that does not pass the same gate as a PR.
      - run: pnpm verify

      # Opens a version PR when changesets are pending; publishes any version
      # not yet on npm otherwise. Publishing authenticates through npm Trusted
      # Publishing (OIDC, via `id-token: write`), so there is no npm token: each
      # package lists this repo and release.yml as its trusted publisher on npm.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          # One `vX.Y.Z` release per version, not one per package: the three
          # packages are fixed to a single version.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The packages share one version, so one tag and one release per publish,
      # with the notes taken from that version's section of CHANGELOG.md.
      - name: Tag and create the GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md --latest
