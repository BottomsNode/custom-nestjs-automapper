name: Release

on:
  push:
    branches: [master]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Never publish something that does not pass the same gate as a PR.
      - run: pnpm verify

      # Opens a version PR when changesets are pending; publishes any version
      # not yet on npm otherwise. NPM_TOKEN must be a token with publish rights
      # on the @nestjs-automapper org — without them npm answers 404.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          # One `vX.Y.Z` release per version, not one per package: the three
          # packages are fixed to a single version.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
