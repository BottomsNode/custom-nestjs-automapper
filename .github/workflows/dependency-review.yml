name: Dependency review

# Fails a PR that adds a dependency with a known vulnerability, before it
# reaches master. Complements Dependabot, which fixes ones already merged.
on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
