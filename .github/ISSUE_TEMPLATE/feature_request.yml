name: Feature request
description: Suggest a feature or an adapter for @nestjs-automapper.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like the API to look like? A code sample helps.
      render: ts
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - core
        - nestjs
        - typeorm
        - A new adapter
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workaround today
      description: How are you handling it now, if at all?
